# web/celery pin the in-network DB/Redis values explicitly, so a host-oriented
# .env (e.g. POSTGRES_HOST=127.0.0.1 for local `manage.py` runs) can never break them.
x-app-environment: &app-environment
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: pawprint
    POSTGRES_USER: pawprint
    POSTGRES_PASSWORD: pawprint
    REDIS_URL: redis://redis:6379/0
    EMAIL_HOST: mailpit
    EMAIL_PORT: "1025"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pawprint
      POSTGRES_USER: pawprint
      POSTGRES_PASSWORD: pawprint
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pawprint"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  celery:
    build: ./backend
    command: celery -A config worker -Q flyers,webhooks,images,default -l info
    env_file: .env
    <<: *app-environment
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env
    <<: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app

volumes:
  pgdata:
